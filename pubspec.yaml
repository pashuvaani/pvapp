name: pashuvaani_app
description: "PashuVaani - AI-Powered Tele-Veterinary & Animal Healthcare App for Pets & Livestock."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  provider: ^6.1.1
  url_launcher: ^6.3.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/logo/ic_adaptive_padded.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/images/logo/ic_adaptive_padded.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/gopu/
    - assets/images/doctors/
    - assets/images/products/
    - assets/images/travel/
